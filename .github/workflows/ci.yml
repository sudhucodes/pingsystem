name: CI Check
run-name: 'CI Check: ${{ github.event.head_commit.message || github.ref }}'

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    lint-and-test:
        name: Run Go Linters & Tests (Windows Cross-Compile)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26.x"
                  check-latest: true

            - name: Verify Go format
              run: |
                  if [ -n "$(gofmt -l .)" ]; then
                    echo "The following files are not formatted properly with gofmt:"
                    gofmt -l .
                    exit 1
                  fi

            - name: Run go vet
              run: go vet ./...

            - name: Run unit tests
              run: go test -v ./...

            - name: Cross-compile for Windows (amd64)
              run: |
                  GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o PingSystem.exe .
                  ls -lh PingSystem.exe
