name: Release Publisher
run-name: 'Release Publisher: ${{ github.event.head_commit.message || github.ref }}'

on:
    push:
        branches:
            - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Build & Publish Binary Release
        runs-on: ubuntu-latest

        permissions:
            contents: write
            pull-requests: write
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26.x"
                  check-latest: true

            - name: Check package.json Version & Tag Status
              id: check_version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TAG_NAME="v${VERSION}"

                  echo "Current package.json version: ${VERSION}"
                  echo "Target release tag: ${TAG_NAME}"
                  echo "version=${VERSION}" >> $GITHUB_OUTPUT
                  echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

                  if git rev-parse "${TAG_NAME}" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "${TAG_NAME}"; then
                    echo "Tag ${TAG_NAME} already exists. Skipping build and release."
                    echo "should_release=false" >> $GITHUB_OUTPUT
                  else
                    echo "New version detected (${TAG_NAME}). Proceeding with release..."
                    echo "should_release=true" >> $GITHUB_OUTPUT
                  fi

            - name: Create Git Tag, Build & Publish Release
              if: steps.check_version.outputs.should_release == 'true'
              run: |
                  VERSION="${{ steps.check_version.outputs.version }}"
                  TAG_NAME="${{ steps.check_version.outputs.tag }}"

                  echo "Configuring Git user..."
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  echo "Creating and pushing tag ${TAG_NAME}..."
                  git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
                  git push origin "${TAG_NAME}"

                  echo "Building Windows executable PingSystem.exe..."
                  GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o PingSystem.exe .

                  echo "Publishing GitHub Release for ${TAG_NAME}..."
                  gh release create "${TAG_NAME}" PingSystem.exe \
                    --title "${TAG_NAME}" \
                    --generate-notes
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
