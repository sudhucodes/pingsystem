name: 🐛 Bug Report
description: Create a report to help us reproduce and fix a bug
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please fill out the information below.
  - type: input
    id: environment
    attributes:
      label: Windows OS Version
      description: What version of Windows are you running PingSystem on? (e.g. Windows 11 23H2, Windows Server 2022)
      placeholder: e.g., Windows 11 Pro 64-bit
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Run 'PingSystem.exe -install'
        2. Put Windows PC to sleep
        3. Wake up PC
        4. See error or missing notification
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Copy relevant log messages from `%APPDATA%\PingSystem\logs\` if available.
      render: text
    validations:
      required: false
